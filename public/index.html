<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>XENO Mobile</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#e9f0ff}button,input{font:inherit}button{background:#19a7c9;border:0;color:#04121a;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#1b2a40;color:#d9ebff}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #8adfff;outline-offset:2px}.shell{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}header{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #233047}h1{font-size:20px;letter-spacing:.22em;margin:0;color:#8adfff}small{color:#8194b0}.tag{font-size:12px;color:#5fd0ab}.actions{display:flex;gap:7px;flex-wrap:wrap}.view{flex:1}.hidden{display:none!important}.messages{padding:18px 18px 130px}.bubble{max-width:86%;padding:13px 16px;border-radius:17px;margin:14px 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#172237;border:1px solid #283852}.bubble.user{margin-left:auto;background:#16364b;border-color:#1c6077}.dock{position:fixed;bottom:0;left:0;right:0;background:#0c1423;border-top:1px solid #233047;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))}.dock-inner{max-width:750px;margin:auto;display:flex;gap:8px}input{flex:1;min-width:0;background:#172237;border:1px solid #31425a;border-radius:12px;padding:14px;color:white;font-size:16px}.panel{padding:18px;border-bottom:1px solid #25384e;background:#111d2e}.panel p{color:#a7b7cb;line-height:1.5}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 18px}.list{padding:0 18px 32px}.chat-item{display:flex;align-items:center;gap:8px;background:#172237;border:1px solid #283852;border-radius:14px;padding:10px;margin-bottom:10px}.chat-item.active{border-color:#19a7c9}.chat-open{flex:1;text-align:left;background:transparent;color:#e9f0ff;padding:7px;min-width:0}.chat-open strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-open small{display:block;margin-top:5px}.mini{padding:8px 10px;font-size:13px}.muted{color:#8194b0;padding:0 18px}.notice{margin:12px 18px;padding:12px;border:1px solid #66552c;background:#30291c;border-radius:10px;color:#ffe3a1}
</style>
</head>
<body>
<div class="shell">
<header><div><h1>XENO</h1><small>MOBILE / v0.4 <span class="tag" id="status">● CONNECTING</span></small></div><div class="actions"><button id="chatsButton" class="secondary">Conversations</button><button id="settingsButton" class="secondary" aria-label="Settings">⚙</button></div></header>
<section id="settings" class="panel hidden"><strong>Settings</strong><p>Conversations are saved locally on this device. Export backups regularly. Local storage is not synchronized between installations or devices.</p><div class="actions"><button id="exportButton">Export JSON backup</button><button id="importButton" class="secondary">Import JSON backup</button><button id="closeSettings" class="secondary">Close</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden"><p>Imported backups merge by conversation ID. Existing chats are not overwritten.</p></section>
<section id="errorNotice" class="notice hidden" role="alert"></section>
<main id="chatView" class="view"><div id="messages" class="messages" aria-live="polite"></div></main>
<main id="conversationsView" class="view hidden"><div class="toolbar"><strong>Your conversations</strong><button id="newChatButton">+ New Chat</button></div><div id="conversationList" class="list"></div></main>
</div>
<form class="dock" id="form"><div class="dock-inner"><input id="prompt" aria-label="Message" placeholder="Message XENO…" autocomplete="off" required maxlength="4000"><button id="sendButton" type="submit">Send</button></div></form>
<script>
(() => {
'use strict';
const OLD_KEY='xeno-mobile-chat-v1';
const STORE_KEY='xeno-mobile-chats-v04';
const area=document.getElementById('messages');
const input=document.getElementById('prompt');
const form=document.getElementById('form');
const sendButton=document.getElementById('sendButton');
const status=document.getElementById('status');
const errorNotice=document.getElementById('errorNotice');
let state=null, busy=false, storageOK=true;
const makeId=()=>crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
const isMessage=m=>m && (m.role==='user'||m.role==='assistant') && typeof m.text==='string' && m.text.length<=20000;
const isChat=c=>c && typeof c.id==='string' && typeof c.title==='string' && Array.isArray(c.messages) && c.messages.every(isMessage);
const blankChat=()=>({id:makeId(),title:'New conversation',createdAt:Date.now(),messages:[]});
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(state));storageOK=true;return true}catch{storageOK=false;notice('Storage is full or unavailable. Export a backup before leaving this page.');return false}};
function notice(message){errorNotice.textContent=message;errorNotice.classList.remove('hidden')}
function clearNotice(){errorNotice.classList.add('hidden');errorNotice.textContent=''}
function load(){
  let existing;
  try{existing=JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch{}
  if(existing && existing.version===4 && Array.isArray(existing.chats) && existing.chats.every(isChat) && existing.chats.length && existing.chats.some(c=>c.id===existing.activeId))return existing;
  let legacy=[];
  try{legacy=JSON.parse(localStorage.getItem(OLD_KEY)||'[]')}catch{}
  if(!Array.isArray(legacy))legacy=[];
  legacy=legacy.filter(isMessage).map(m=>({role:m.role,text:m.text}));
  const chat=blankChat();
  if(legacy.length){chat.title='Original conversation';chat.messages=legacy}
  return {version:4,activeId:chat.id,chats:[chat]};
}
state=load();save();
const current=()=>state.chats.find(c=>c.id===state.activeId);
const shorten=s=>s.length>44?s.slice(0,44)+'…':s;
function renderMessages(){
  area.replaceChildren();const chat=current();
  if(!chat.messages.length){const p=document.createElement('div');p.className='bubble';p.textContent='XENO ready. Send a message to begin.';area.append(p)}
  for(const m of chat.messages){const p=document.createElement('div');p.className='bubble '+(m.role==='user'?'user':'');p.textContent=m.text;area.append(p)}
  window.scrollTo(0,document.body.scrollHeight);
}
function renderList(){
  const list=document.getElementById('conversationList');list.replaceChildren();
  for(const chat of [...state.chats].reverse()){
    const item=document.createElement('div');item.className='chat-item'+(chat.id===state.activeId?' active':'');
    const open=document.createElement('button');open.className='chat-open';
    const name=document.createElement('strong');name.textContent=chat.title;
    const meta=document.createElement('small');meta.textContent=`${chat.messages.length} messages`;
    open.append(name,meta);open.onclick=()=>{if(busy)return;state.activeId=chat.id;save();show('chat')};
    const rename=document.createElement('button');rename.className='secondary mini';rename.textContent='Rename';rename.setAttribute('aria-label',`Rename ${chat.title}`);
    rename.onclick=()=>{if(busy)return;const value=prompt('Conversation name:',chat.title);if(value===null)return;const title=value.trim().slice(0,80);if(!title)return;chat.title=title;save();renderList()};
    const del=document.createElement('button');del.className='secondary mini';del.textContent='Delete';del.setAttribute('aria-label',`Delete ${chat.title}`);
    del.onclick=()=>{if(busy)return;if(!confirm(`Permanently delete "${chat.title}" from XENO v0.4?`))return;state.chats=state.chats.filter(c=>c.id!==chat.id);if(!state.chats.length)state.chats.push(blankChat());if(state.activeId===chat.id)state.activeId=state.chats[0].id;save();renderList()};
    item.append(open,rename,del);list.append(item);
  }
}
function show(which){
  const isChat=which==='chat';document.getElementById('chatView').classList.toggle('hidden',!isChat);document.getElementById('conversationsView').classList.toggle('hidden',isChat);form.classList.toggle('hidden',!isChat);
  if(isChat)renderMessages();else renderList();
}
function newChat(){if(busy)return;const chat=blankChat();state.chats.push(chat);state.activeId=chat.id;save();show('chat');input.focus()}
async function checkHealth(){try{const r=await fetch('/health',{cache:'no-store'});if(!r.ok)throw Error('not ready');const d=await r.json();status.textContent=d.status==='online'?'● AI ONLINE':'● UNAVAILABLE'}catch{status.textContent='● LOGIN / CONNECTION REQUIRED'}}
form.addEventListener('submit',async event=>{
  event.preventDefault();if(busy)return;
  const message=input.value.trim();if(!message)return;
  const chat=current();
  chat.messages.push({role:'user',text:message});
  if(chat.title==='New conversation')chat.title=shorten(message);
  save();input.value='';renderMessages();busy=true;sendButton.disabled=true;sendButton.textContent='Thinking…';
  try{
    const messages=chat.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-20).map(m=>({role:m.role,content:m.text}));
    const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({provider:'groq',messages})});
    const data=await response.json();if(!response.ok)throw Error(data.error||'Gateway error');
    chat.messages.push({role:'assistant',text:data.reply||'No response received.'});save();
  }catch(err){notice(`Connection error: ${err.message}. Your message remains saved. Sign in through Safari if needed, then try again.`)}
  finally{busy=false;sendButton.disabled=false;sendButton.textContent='Send';renderMessages();checkHealth()}
});
document.getElementById('chatsButton').onclick=()=>show('conversations');
document.getElementById('newChatButton').onclick=newChat;
document.getElementById('settingsButton').onclick=()=>document.getElementById('settings').classList.toggle('hidden');
document.getElementById('closeSettings').onclick=()=>document.getElementById('settings').classList.add('hidden');
document.getElementById('exportButton').onclick=()=>{
  const payload=JSON.stringify({format:'xeno-mobile-v04',exportedAt:new Date().toISOString(),data:state},null,2);
  const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`xeno-conversations-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
};
document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{
  const file=e.target.files?.[0];e.target.value='';if(!file)return;
  if(file.size>5_000_000){notice('Backup file exceeds 5 MB.');return}
  try{
    const parsed=JSON.parse(await file.text());const imported=parsed?.format==='xeno-mobile-v04'?parsed.data:null;
    if(!imported||imported.version!==4||!Array.isArray(imported.chats)||!imported.chats.every(isChat))throw Error('Invalid XENO v0.4 backup');
    let count=0;const existing=new Set(state.chats.map(c=>c.id));
    for(const chat of imported.chats){if(!existing.has(chat.id)){state.chats.push(chat);existing.add(chat.id);count++}}
    if(!save())return;clearNotice();renderList();alert(`Imported ${count} conversation(s). Existing conversations were preserved.`);
  }catch(err){notice(`Import failed: ${err.message}`)}
};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
show('chat');checkHealth();
})();
</script>
</body>
</html>
